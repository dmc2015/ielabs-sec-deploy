name: Security gates

on:
  workflow_call:
jobs:
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec brakeman --no-pager --exit-on-warn --exit-on-error

  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # || true — if the command exits with non-zero
      # (vulnerabilities found), replace that with true (exit 0).
      # CI sees success regardless of findings. Doesn't skip the
      # scan, just stops failures from blocking the pipeline.
      - run: bundle exec bundler-audit check --update || true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile -t ielabs:test .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ielabs:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-dirs: "/usr/local/bundle/ruby/*/gems"

  build-sign-publish:
    needs: [brakeman, bundler-audit, gitleaks, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
              ghcr.io/dmc2015/ielabs:${{ github.sha }}
              ghcr.io/dmc2015/ielabs:latest
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/dmc2015/ielabs@${{ steps.build.outputs.digest }}
